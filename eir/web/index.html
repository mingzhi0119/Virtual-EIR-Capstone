<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Virtual EIR · GOAT AI</title>
  <style>
    :root{color-scheme:light;--bg:#f4f6f8;--surface:#fff;--ink:#182839;--muted:#566575;--border:#dce3eb;--accent:#145b57}
    *{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
    header{padding:24px 4vw;background:var(--surface);border-bottom:1px solid var(--border)}h1{font-size:25px;margin:0}header p{margin:3px 0;color:var(--muted)}
    main{display:grid;grid-template-columns:minmax(300px,1fr) minmax(350px,1.6fr);gap:20px;max-width:1350px;margin:24px auto;padding:0 24px}
    section{padding:22px;background:var(--surface);border:1px solid var(--border);border-radius:14px;min-width:0}h2{font-size:18px;margin:0 0 12px}
    button,select,textarea{font:inherit;border-radius:7px;border:1px solid var(--border)}button{padding:9px 14px;background:var(--accent);color:white;cursor:pointer}button.secondary{background:white;color:var(--ink)}button:disabled{opacity:.5;cursor:wait}
    select{padding:8px;background:white;max-width:100%}textarea{width:100%;padding:12px;resize:vertical;background:#fafcfd;color:var(--ink)}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.hint{font-size:13px;color:var(--muted)}#profile{font:13px/1.5 ui-monospace,monospace;min-height:410px}
    #transcript{min-height:290px;max-height:58vh;overflow:auto;padding:8px 0}article{white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;margin:10px 0;background:#f1f6f5;border-radius:9px}article.assistant{background:#f3f5f8}article strong{display:block;font-size:12px;margin-bottom:4px;color:var(--muted)}
    #status{margin:12px 4vw;color:var(--muted)}#status.error{color:#9a2525}a{color:var(--accent)}label{display:block;font-size:13px;color:var(--muted)}summary{cursor:pointer}.meta{font:12px/1.5 ui-monospace,monospace;overflow-wrap:anywhere}
    @media(max-width:800px){main{grid-template-columns:1fr;padding:0 12px}#profile{min-height:250px}}
  </style>
</head>
<body>
<header><h1>Virtual EIR <span class="hint">/ built on GOAT AI</span></h1><p>首次咨询 → 确认资料与行动 → 新会话复盘。仅本地单用户、虚构案例。</p><a href="http://127.0.0.1:62606" target="_blank" rel="noopener">打开完整 GOAT AI 聊天平台</a></header>
<div id="status" role="status" aria-live="polite">正在连接本地服务…</div>
<main>
<section><h2>01 · 项目记忆（由你确认）</h2>
  <label for="ventures">选择创业项目</label><div class="row"><select id="ventures"></select><button id="new" class="secondary">新建虚构项目</button></div>
  <p class="hint">模型不会自动把建议写成事实。修改资料后点击确认；计划数量和实际完成数量分别保存。</p>
  <label for="profile">可编辑资料、假设、证据、行动（JSON）</label><textarea id="profile" spellcheck="false"></textarea>
  <div class="row"><button id="save">确认并保存资料</button><button id="plan" class="secondary">填写五次访谈计划</button><button id="result" class="secondary">填写两次访谈结果</button></div>
  <p class="hint">两个填写按钮仅准备虚构演示数据，仍需你确认保存。跟进会话会读取保存后的状态。</p><p id="revision" class="meta"></p>
</section>
<section><h2>02 · 文字教练与连续指导</h2>
  <label for="models">已安装模型（来自 GOAT / Ollama）</label><div class="row"><select id="models"></select><button id="followup" class="secondary">新建跟进会话</button></div>
  <label for="sessions">当前项目的会话</label><select id="sessions"></select>
  <div id="transcript" aria-live="polite"></div>
  <label for="message">输入本次情况</label><textarea id="message" rows="3" placeholder="我想验证校园晚餐配送这个想法，请帮我确定第一步。"></textarea>
  <div class="row"><button id="send">发送给教练</button><button id="initial" class="secondary">填入首次咨询</button><button id="followtext" class="secondary">填入复盘问题</button></div>
  <p class="hint">回复结束后展示；底层真实复用 GOAT 的 SSE 聊天。新会话只读取已确认项目状态，不要求粘贴旧对话。建议未经 EIR 专家评估。</p><p id="sessionmeta" class="meta"></p>
</section>
</main>
<script type="module">
const $=id=>document.getElementById(id);let venture=null,session=null,busy=false;
const initial={name:'校园晚餐配送（虚构）',customer:'校内晚间学习的学生',problem:'晚间获得合适晚餐可能不方便',stage:'idea',assumptions:['学生最关心配送速度，尚未验证'],evidence:[],actions:[]};
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
async function api(path,method='GET',body){const response=await fetch('/api'+path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const data=await response.json();if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));return data}
function option(value,text){const el=document.createElement('option');el.value=value;el.textContent=text;return el}
function editable(){if(!venture)throw Error('请先新建项目。');const p=JSON.parse($('profile').value);if(!p||typeof p!=='object'||!Array.isArray(p.actions))throw Error('资料必须是包含 actions 数组的 JSON 对象。');return p}
function normalized(value){if(Array.isArray(value))return value.map(normalized);if(value&&typeof value==='object')return Object.fromEntries(Object.keys(value).sort().map(key=>[key,normalized(value[key])]));return value}
function dirty(){return venture&&JSON.stringify(normalized(JSON.parse($('profile').value)))!==JSON.stringify(normalized(venture.profile))}
function requireSaved(){if(dirty())throw Error('资料有未保存修改，请先确认保存，再继续。')}
function render(){if(!venture)return;$('profile').value=JSON.stringify(venture.profile,null,2);$('revision').textContent=`项目 ${venture.venture_id} · 已确认版本 ${venture.revision}`;renderTurns()}
function renderTurns(){const box=$('transcript');box.replaceChildren();for(const turn of session?.turns||[]){const node=document.createElement('article');node.className=turn.role;const label=document.createElement('strong');label.textContent=turn.role==='user'?'你':'Virtual EIR';node.append(label,document.createTextNode(turn.content));box.append(node)}$('sessionmeta').textContent=session?`会话 ${session.session_id} · ${session.turns.length/2} 次问答`:'';box.scrollTop=box.scrollHeight}
function setSessions(list,selected){$('sessions').replaceChildren(...list.map((s,i)=>option(s.session_id,`会话 ${i+1} · ${s.turns.length/2} 次问答`)));session=list.find(s=>s.session_id===selected)||list.at(-1)||null;if(session){$('sessions').value=session.session_id;localStorage.setItem(`eir-session-${venture.venture_id}`,session.session_id)}renderTurns()}
async function refreshSessions(selected){setSessions(await api(`/ventures/${venture.venture_id}/sessions`),selected)}
async function load(id){try{const next=await api(`/ventures/${id}`);const list=await api(`/ventures/${id}/sessions`);venture=next;localStorage.setItem('eir-selected-venture',id);setSessions(list,localStorage.getItem(`eir-session-${id}`));render();status('已从数据库恢复项目资料及会话。')}catch(error){if(venture)$('ventures').value=venture.venture_id;throw error}}
async function refreshVentures(selected){const list=await api('/ventures');$('ventures').replaceChildren(...list.map(v=>option(v.venture_id,v.profile.name)));const id=selected||localStorage.getItem('eir-selected-venture');const chosen=list.find(v=>v.venture_id===id)||list[0];if(chosen){$('ventures').value=chosen.venture_id;await load(chosen.venture_id)}}
function disabled(value){busy=value;for(const el of document.querySelectorAll('button,select,textarea'))el.disabled=value;for(const id of ['plan','result','save','followup'])$(id).disabled=value||!venture;$('send').disabled=value||!$('models').value||!venture}
async function run(task){if(busy)return;disabled(true);try{await task()}catch(error){status(error.message,true)}finally{disabled(false)}}
$('new').onclick=()=>run(async()=>{requireSaved();const created=await api('/ventures','POST',initial);await refreshVentures(created.venture_id);session=await api(`/ventures/${venture.venture_id}/sessions`,'POST');renderTurns();await refreshSessions(session.session_id);status('已建立虚构项目。首次咨询后请确认行动计划。')});
$('ventures').onchange=()=>run(async()=>{try{requireSaved();await load($('ventures').value)}catch(error){if(venture)$('ventures').value=venture.venture_id;throw error}});
$('save').onclick=()=>run(async()=>{if(!venture)throw Error('请先新建项目。');venture=await api(`/ventures/${venture.venture_id}`,'PUT',{profile:JSON.parse($('profile').value),expected_revision:venture.revision});render();status('你已确认并保存资料；下次模型调用会读取这个版本。')});
$('plan').onclick=()=>run(async()=>{const p=editable();p.actions=[{description:'访谈五位晚间学习的学生，询问最近一次买晚餐的实际经历、替代选择及费用；记录顾虑和原话。',target_count:5,completed_count:0,result:''}];$('profile').value=JSON.stringify(p,null,2);status('虚构计划已填入，尚未保存。请审阅并确认。')});
$('result').onclick=()=>run(async()=>{const p=editable();if(!p.actions.length||!p.actions[0]||typeof p.actions[0]!=='object')throw Error('请先确认并保存首次行动计划。');p.actions[0].completed_count=2;p.actions[0].result='只完成两次访谈，两人提到价格比配送速度更重要。';p.evidence=[{observation:'两名受访学生报告更关心价格，而非速度。',sample_size:2,source:'虚构案例：创业者报告',limitation:'仅两个便利样本，不能代表市场或证明付费意愿。'}];$('profile').value=JSON.stringify(p,null,2);status('虚构结果已填入，尚未保存；完成数量为 2，计划仍为 5。')});
$('followup').onclick=()=>run(async()=>{if(!venture)throw Error('请先新建项目。');requireSaved();session=await api(`/ventures/${venture.venture_id}/sessions`,'POST');renderTurns();try{await refreshSessions(session.session_id)}catch(error){status(`新会话已建立；列表刷新失败：${error.message}`,true);return}status('已建立全新跟进会话，将读取同一项目的已确认资料。')});
$('sessions').onchange=()=>run(async()=>{const previous=session;try{requireSaved();session=await api(`/ventures/${venture.venture_id}/sessions/${$('sessions').value}`);localStorage.setItem(`eir-session-${venture.venture_id}`,session.session_id);renderTurns()}catch(error){if(previous)$('sessions').value=previous.session_id;throw error}});
$('initial').onclick=()=>{$('message').value='我想做面向校内晚间学习学生的晚餐配送。现在只有想法，还没访谈。我猜他们最在乎速度。我本周最多能访谈五人。请问两个关键问题并给我一个本周可以做的验证行动。'};
$('followtext').onclick=()=>{$('message').value='我已经保存了这次的访谈结果。请结合上次的行动计划复盘，说明现在该如何调整下一步；不要把计划数量当成完成数量。'};
$('send').onclick=()=>run(async()=>{if(!venture)throw Error('请先新建项目。');requireSaved();if(!session){session=await api(`/ventures/${venture.venture_id}/sessions`,'POST')}const message=$('message').value.trim();if(!message)throw Error('请输入本次情况。');status('正在通过 GOAT AI 调用本地模型…');const result=await api(`/ventures/${venture.venture_id}/sessions/${session.session_id}/chat`,'POST',{message,model:$('models').value});session=result.session;renderTurns();$('message').value='';const saved=`回复已保存 · 使用资料版本 ${result.context_revision} · ${result.elapsed_seconds} 秒。建议尚未写入事实，请自行确认。`;try{await refreshSessions(session.session_id)}catch(error){status(`${saved} 列表刷新失败：${error.message}`,true);return}status(saved)});
window.addEventListener('beforeunload',event=>{try{if(dirty()){event.preventDefault();event.returnValue=''}}catch{event.preventDefault();event.returnValue=''}});
await run(async()=>{await refreshVentures();try{const list=(await api('/models')).models;$('models').replaceChildren(...list.map(m=>option(m,m)));if(list.includes('gemma4:26b'))$('models').value='gemma4:26b';if(!list.length)throw Error('没有可用模型。请检查 Ollama。');status(venture?'资料已恢复，可以继续咨询。':'服务已连接。请点击新建虚构项目开始。')}catch(error){status(error.message,true)}});
</script>
</body></html>
