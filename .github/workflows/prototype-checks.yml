name: Local prototype checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/goat/frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r apps/goat/requirements-ci.txt
      - name: Capstone lint and deterministic tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m ruff check eir tests scripts/verify-demo.py scripts/verify-english.py
          python -m ruff format --check eir tests scripts/verify-demo.py scripts/verify-english.py
          python -m pytest tests -q
      - name: GOAT backend and HTTP contract proof
        working-directory: apps/goat
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m ruff check backend goat_ai __tests__/backend/services/test_ollama_thinking_request.py __tests__/backend/services/test_object_storage.py __tests__/backend/services/test_knowledge_service.py __tests__/backend/services/test_media_service.py
          python -m ruff format --check goat_ai/llm/ollama_client.py __tests__/backend/services/test_ollama_thinking_request.py __tests__/backend/services/test_object_storage.py __tests__/backend/services/test_knowledge_service.py __tests__/backend/services/test_media_service.py
          python -m pytest __tests__/backend __tests__/contracts -q
          python -m tools.contracts.check_api_contract_sync
          lint-imports
      - name: GOAT frontend regression proof
        working-directory: apps/goat/frontend
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm run lint
          npm run depcruise
          npm run contract:check
          npm test -- --run --maxWorkers=1
          npm run build
      - name: English EIR interface proof
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node apps/goat/frontend/node_modules/typescript/bin/tsc -p eir/frontend/tsconfig.json
          node apps/goat/frontend/node_modules/eslint/bin/eslint.js --config eir/frontend/eslint.config.mjs eir/web/app.js scripts/build-eir-ui.mjs scripts/verify-ui.mjs
          node scripts/build-eir-ui.mjs
